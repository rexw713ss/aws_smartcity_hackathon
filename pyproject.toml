[project]
name = "new-taipei-youth-compass"
version = "0.1.0"
description = "Offline-first youth public-data onboarding and policy analytics platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "duckdb>=1.4.0",
    "fastapi>=0.116.0",
    "jsonschema>=4.23.0",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "polars>=1.32.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "streamlit>=1.49,<2",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
youth-compass = "youth_compass.cli:app"
youth-compass-local = "adapters.local.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.4.0",
    "httpx>=0.28.0",
    "moto[glue]>=5.0.0",
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "reportlab>=4.4,<5",
    "ruff>=0.12.0",
    "types-openpyxl>=3.1,<4",
    "types-pyyaml>=6.0.12.20250516",
    "types-jsonschema>=4.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/youth_compass", "adapters", "apps"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["youth_compass"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "apps", "scripts", "infra"]
exclude = [
    # Stage 2 delivers these adapters; they are type-checked when they land.
    "^adapters/aws/",
    # CDK writes generated CloudFormation JSON and staging assets here.
    "^infra/cdk\\.out/",
]

# botocore ships no type stubs / py.typed marker; scope the untyped-import
# tolerance to it rather than weakening strict mode elsewhere.
[[tool.mypy.overrides]]
module = ["botocore.*", "boto3.*", "moto.*"]
ignore_missing_imports = true
