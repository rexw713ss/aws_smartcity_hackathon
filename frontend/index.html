<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="New Taipei Youth Policy decision assistant: youth policy answers drawn from published New Taipei datasets, each one cited." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk substitutes for PolySans (commercial); weight 400 only, as
         the system requires. Noto Sans TC covers Traditional Chinese data labels. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem('youth-compass-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (error) { /* Private storage can be unavailable. */ }
    </script>
    <title>新北青策 · 決策助理</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
